[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waldo-ai"
version = "0.1.0"
description = "Reproducible baselines and YOLO experiments for locating Wally/Waldo in crowded illustrations."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.2,<3.0",
  "matplotlib>=3.8,<4.0",
  "seaborn>=0.13,<1.0",
  "Pillow>=10,<12",
  "opencv-python>=4.9,<5",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
train = ["ultralytics==8.3.170"]
dev = ["pytest>=8,<9", "imagehash>=4.3,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

